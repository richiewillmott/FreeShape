name: Translation validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "freeshape/i18n.py"
      - "freeshape/locale/**"
      - "freeshape/ui/**"
      - "freeshape/__main__.py"
      - "packaging/freeshape.spec"
      - "pyproject.toml"
      - "tests/test_i18n.py"
      - ".github/workflows/localization.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      FREESHAPE_LANG: en
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt and application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -r requirements.txt pytest
      - name: Validate Python and Russian widgets
        run: |
          python -m compileall -q freeshape
          python -m pytest -q -rs tests/test_i18n.py
