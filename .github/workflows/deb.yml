# Builds a Debian / Ubuntu package (.deb) of any released FreeShape version and attaches it to that release.
#   Actions tab → "Debian package" → Run workflow → type the release tag (e.g. v2.6.0).
# The packaging script comes from this branch, the FreeShape code from the tag — so a release made before the
# .deb existed can still get one. (New releases also get a .deb from the Linux job in mac.yml.)
name: Debian package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v2.6.0)"
        required: true
        default: "v2.6.0"

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04      # an older Ubuntu, so the package also installs on newer Debian / Ubuntu
    timeout-minutes: 60
    steps:
      - name: Get the packaging script (this branch)
        uses: actions/checkout@v4
        with:
          path: ci
      - name: Get FreeShape ${{ inputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 file
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt pyinstaller
      - name: Build the .deb
        run: PYTHON=python bash ci/packaging/linux/build_deb.sh src
      - name: Install it and check FreeShape starts
        run: |
          sudo apt-get install -y ./src/dist/freeshape_*_amd64.deb
          QT_QPA_PLATFORM=offscreen freeshape --self-test "$PWD/installed-selftest.txt" || true
          cat installed-selftest.txt
          grep -q '^OK' installed-selftest.txt
          test -f /usr/share/applications/freeshape.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: freeshape-deb
          path: src/dist/*.deb
      - name: Attach to the ${{ inputs.tag }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" src/dist/freeshape_*_amd64.deb --clobber -R "${{ github.repository }}"
