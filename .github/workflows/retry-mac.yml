# Re-runs the Mac build automatically when it fails or times out — usually because GitHub had no Mac free.
# Only the jobs that failed are run again (Windows and Linux keep their finished files), up to 5 tries in all.
# A real failure in Windows or Linux is NOT retried, and a run you cancel yourself is left alone.
name: Retry the Mac build

on:
  workflow_run:
    workflows: ["Build (Windows, Mac, Linux)"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')
      && github.event.workflow_run.run_attempt < 100
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the Mac job if it was the one that failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          failed=$(gh run view "$RUN" --json jobs \
                   --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name] | join(",")')
          echo "Jobs that didn't succeed: $failed"
          if [ "$failed" != "mac" ]; then
            echo "Something other than the Mac job failed - not retrying, have a look at the logs."
            exit 0
          fi
          sleep 300          # give GitHub a few minutes to free up a Mac
          gh run rerun "$RUN" --failed
