name: Keyboard shortcut regression tests
on:
  push:
    branches: [contrib/layout-independent-shortcuts]
  pull_request:
    paths:
      - 'freeshape/ui/keyboard.py'
      - 'freeshape/ui/mainwindow.py'
      - 'freeshape/ui/sketcher.py'
      - 'tests/test_keyboard_layout.py'
      - '.github/workflows/keyboard-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_keyboard_layout.py tests/test_nav.py tests/test_sketch_inference.py tests/test_sketch_snap.py
